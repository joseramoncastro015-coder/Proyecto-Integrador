<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios | IAEV Asesorías</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <!--=================================
            MENÚ LATERAL
    =================================-->

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">

            Inicio

        </a>

        <a href="Registrar.html">

            Registrar

        </a>

        <a href="Historial.html">

            Historial

        </a>

        <a href="Reportes.html">

            Reportes

        </a>

        <a href="Perfil.html">

            Perfil

        </a>

        <div id="menuAdmin">

            <a href="Usuarios.html" class="active">

                Usuarios

            </a>

            <a href="Maestros.html">

                Maestros

            </a>

        </div>

    </nav>

    <!--=================================
            CONTENIDO
    =================================-->

    <main class="main">

        <!--=================================
                HEADER
        =================================-->

        <header class="header">

            <div class="user-info">

                <div class="avatar" id="avatar">

                    AD

                </div>

                <div>

                    <h3 id="nombreUsuario">

                        Administrador

                    </h3>

                    <small id="rolUsuario">

                        Administrador

                    </small>

                </div>

                <img
                    src="logoIAEV.png"
                    alt="Logo IAEV"
                    class="header-logo">

            </div>

            <div class="header-buttons">

                <a
                    href="Login.html"
                    class="btn btn-danger"
                    id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <!--=================================
                TÍTULO
        =================================-->

        <h1 class="mb-30">

            Administración de Usuarios

        </h1>

        <!--=================================
                FORMULARIO
        =================================-->

        <section class="card">

            <h2 class="mb-20">

                Agregar Usuario

            </h2>

            <form id="formUsuario">

                <div class="form-row">

                    <div class="form-group">

                        <label>Nombre</label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Nombre completo"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Usuario</label>

                        <input
                            type="text"
                            id="usuario"
                            placeholder="Usuario"
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Correo</label>

                        <input
                            type="email"
                            id="correo"
                            placeholder="correo@ejemplo.com"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Carrera</label>

                        <input
                            type="text"
                            id="carrera"
                            placeholder="Ingeniería..."
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Rol</label>

                        <select id="rol" required>

                            <option value="">

                                Seleccionar

                            </option>

                            <option value="maestro">

                                Maestro

                            </option>

                            <option value="administrador">

                                Administrador

                            </option>

                        </select>

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Guardar Usuario

                </button>

            </form>

        </section>

                <!--=================================
                TABLA DE USUARIOS
        =================================-->

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Usuario</th>

                        <th>Nombre</th>

                        <th>Correo</th>

                        <th>Rol</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaUsuarios">

                </tbody>

            </table>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./firebase.js";

        import { signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {

            collection,
            addDoc,
            getDocs,
            deleteDoc,
            updateDoc,
            doc

        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        //====================================
        // DATOS DEL USUARIO
        //====================================

        const rolLogin = localStorage.getItem("rol");

        const nombreLogin = localStorage.getItem("nombre");

        if(!rolLogin){

            window.location.href="Login.html";

        }

        if(rolLogin!=="administrador"){

            alert("No tienes permisos para acceder a esta página.");

            window.location.href="Inicio.html";

        }

        document.getElementById("nombreUsuario").textContent=nombreLogin;

        document.getElementById("rolUsuario").textContent="Administrador";

        document.getElementById("avatar").textContent="AD";

        //====================================
        // CERRAR SESIÓN
        //====================================

        document.getElementById("cerrarSesion").addEventListener("click",async function(e){

            e.preventDefault();

            await signOut(auth);

            localStorage.clear();

            window.location.href="Login.html";

        });

                //====================================
        // AGREGAR USUARIO
        //====================================

        document.getElementById("formUsuario").addEventListener("submit", async function(e){

            e.preventDefault();

            try{

                await addDoc(collection(db,"usuarios"),{

                    nombre: document.getElementById("nombre").value,

                    usuario: document.getElementById("usuario").value,

                    correo: document.getElementById("correo").value,

                    carrera: document.getElementById("carrera").value,

                    rol: document.getElementById("rol").value

                });

                alert("Usuario guardado correctamente.");

                document.getElementById("formUsuario").reset();

                cargarUsuarios();

            }

            catch(error){

                console.error(error);

                alert("Error al guardar el usuario.");

            }

        });

        //====================================
        // CARGAR USUARIOS
        //====================================

        async function cargarUsuarios(){

            const tabla = document.getElementById("tablaUsuarios");

            tabla.innerHTML = "";

            try{

                const consulta = await getDocs(collection(db,"usuarios"));

                consulta.forEach((documento)=>{

                    const datos = documento.data();

                    tabla.innerHTML += `

                    <tr>

                        <td>${datos.usuario}</td>

                        <td>${datos.nombre}</td>

                        <td>${datos.correo}</td>

                        <td>${datos.rol.charAt(0).toUpperCase()+datos.rol.slice(1)}</td>

                        <td>

                            <button
                                class="btn btn-primary"
                                onclick="editarUsuario('${documento.id}')">

                                Editar

                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="eliminarUsuario('${documento.id}')">

                                Eliminar

                            </button>

                        </td>

                    </tr>

                    `;

                });

            }

            catch(error){

                console.error(error);

                alert("No se pudieron cargar los usuarios.");

            }

        }

        cargarUsuarios();

                //====================================
        // EDITAR USUARIO
        //====================================

        window.editarUsuario = async function(id){

            try{

                const nuevoNombre = prompt("Nuevo nombre:");

                if(nuevoNombre===null) return;

                const nuevoUsuario = prompt("Nuevo usuario:");

                if(nuevoUsuario===null) return;

                const nuevoCorreo = prompt("Nuevo correo:");

                if(nuevoCorreo===null) return;

                const nuevaCarrera = prompt("Nueva carrera:");

                if(nuevaCarrera===null) return;

                const nuevoRol = prompt("Rol (maestro o administrador):");

                if(nuevoRol===null) return;

                await updateDoc(doc(db,"usuarios",id),{

                    nombre:nuevoNombre,

                    usuario:nuevoUsuario,

                    correo:nuevoCorreo,

                    carrera:nuevaCarrera,

                    rol:nuevoRol.toLowerCase()

                });

                alert("Usuario actualizado correctamente.");

                cargarUsuarios();

            }

            catch(error){

                console.error(error);

                alert("No se pudo actualizar el usuario.");

            }

        };

        //====================================
        // ELIMINAR USUARIO
        //====================================

        window.eliminarUsuario = async function(id){

            const confirmar = confirm("¿Deseas eliminar este usuario?");

            if(!confirmar){

                return;

            }

            try{

                await deleteDoc(doc(db,"usuarios",id));

                alert("Usuario eliminado correctamente.");

                cargarUsuarios();

            }

            catch(error){

                console.error(error);

                alert("No se pudo eliminar el usuario.");

            }

        };

    </script>

</body>

</html>
