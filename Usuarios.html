<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios | IAEV Asesorías</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">Inicio</a>
        <a href="Registrar.html">Registrar</a>
        <a href="Historial.html">Historial</a>
        <a href="Reportes.html">Reportes</a>
        <a href="Perfil.html">Perfil</a>

        <div id="menuAdmin">

            <a href="Usuarios.html" class="active">Usuarios</a>

            <a href="Maestros.html">Maestros</a>

        </div>

    </nav>

    <main class="main">

        <header class="header">

            <div class="user-info">

                <div class="avatar" id="avatar">

                    AD

                </div>

                <div>

                    <h3 id="nombreUsuario">

                        Administrador

                    </h3>

                    <small id="rolUsuario">

                        Administrador

                    </small>

                </div>

                <img
                    src="logoIAEV.png"
                    alt="Logo IAEV"
                    class="header-logo">

            </div>

            <div class="header-buttons">

                <a
                    href="Login.html"
                    class="btn btn-danger"
                    id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <h1 class="mb-30">

            Usuarios

        </h1>

        <section class="card">

            <form id="formUsuario">

                                <div class="form-group">

                    <label>Nombre</label>

                    <input
                        type="text"
                        id="nombre"
                        required>

                </div>

                <div class="form-group">

                    <label>Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        required>

                </div>

                <div class="form-group">

                    <label>Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        required>

                </div>

                <div class="form-group">

                    <label>Rol</label>

                    <select id="rol" required>

                        <option value="">Selecciona un rol</option>
                        <option value="administrador">Administrador</option>
                        <option value="maestro">Maestro</option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Agregar Usuario

                </button>

            </form>

        </section>

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaUsuarios"></tbody>

            </table>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./firebase.js";

        import { signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            updateDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

                const rolLogin = localStorage.getItem("rol");
        const nombreLogin = localStorage.getItem("nombre");

        if(!rolLogin){

            window.location.href="Login.html";

        }

        if(rolLogin!=="administrador"){

            alert("No tienes permisos para acceder a esta página.");

            window.location.href="Inicio.html";

        }

        document.getElementById("nombreUsuario").textContent=nombreLogin;
        document.getElementById("rolUsuario").textContent="Administrador";
        document.getElementById("avatar").textContent="AD";

        document.getElementById("cerrarSesion").addEventListener("click",async e=>{

            e.preventDefault();

            await signOut(auth);

            localStorage.clear();

            window.location.href="Login.html";

        });

        document.getElementById("formUsuario").addEventListener("submit",async e=>{

            e.preventDefault();

            const nombre=document.getElementById("nombre").value.trim();
            const usuario=document.getElementById("usuario").value.trim();
            const password=document.getElementById("password").value;
            const rol=document.getElementById("rol").value;

            try{

                await addDoc(collection(db,"usuarios"),{

                    nombre,
                    usuario,
                    password,
                    rol

                });

                alert("Usuario agregado correctamente.");

                document.getElementById("formUsuario").reset();

                cargarUsuarios();

            }catch(error){

                alert(error.message);

            }

        });

        async function cargarUsuarios(){

            const tabla=document.getElementById("tablaUsuarios");

            tabla.innerHTML="";

            try{

                const consulta=await getDocs(collection(db,"usuarios"));

                consulta.forEach(documento=>{

                    const datos=documento.data();

                    tabla.innerHTML+=`

                    <tr>

                        <td>${datos.usuario}</td>

                        <td>${datos.nombre}</td>

                        <td>${datos.rol.charAt(0).toUpperCase()+datos.rol.slice(1)}</td>

                        <td>

                            <button
                                class="btn btn-primary"
                                onclick="editarUsuario('${documento.id}')">

                                Editar

                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="eliminarUsuario('${documento.id}')">

                                Eliminar

                            </button>

                        </td>

                    </tr>

                    `;

                });

            }catch(error){

                console.error(error);

                alert("No se pudieron cargar los usuarios.");

            }

        }

        cargarUsuarios();

                window.editarUsuario = async function(id){

            const nuevoNombre = prompt("Nuevo nombre:");

            if(!nuevoNombre) return;

            const nuevoUsuario = prompt("Nuevo usuario:");

            if(!nuevoUsuario) return;

            const nuevaCarrera = prompt("Nueva carrera:");

            if(!nuevaCarrera) return;

            const nuevoRol = prompt("Nuevo rol (maestro o administrador):");

            if(!nuevoRol) return;

            try{

                await updateDoc(doc(db,"usuarios",id),{

                    nombre:nuevoNombre,
                    usuario:nuevoUsuario,
                    carrera:nuevaCarrera,
                    rol:nuevoRol.toLowerCase()

                });

                alert("Usuario actualizado correctamente.");

                cargarUsuarios();

            }catch(error){

                alert(error.message);

            }

        }

        window.eliminarUsuario = async function(id){

            const confirmar = confirm("¿Deseas eliminar este usuario?");

            if(!confirmar) return;

            try{

                await deleteDoc(doc(db,"usuarios",id));

                alert("Usuario eliminado correctamente.");

                cargarUsuarios();

            }catch(error){

                alert(error.message);

            }

        }

    </script>

</body>

</html>
