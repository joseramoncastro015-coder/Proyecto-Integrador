<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reportes | IAEV Asesorías</title>

    <link rel="stylesheet"
          href="Estilo.css">

</head>

<body>

    <!--==========================
            MENÚ LATERAL
    ===========================-->

    <nav class="sidebar">

        <h2>

            IAEV
            <br>
            ASESORÍAS

        </h2>

        <hr>

        <a href="Inicio.html">

            Inicio

        </a>

        <a href="Registrar.html">

            Registrar

        </a>

        <a href="Historial.html">

            Historial

        </a>

        <a href="Reportes.html"
           class="active">

            Reportes

        </a>

        <a href="Perfil.html">

            Perfil

        </a>

        <div id="menuAdmin">

            <a href="Usuarios.html">

                Usuarios

            </a>

            <a href="Maestros.html">

                Maestros

            </a>

        </div>

    </nav>

    <!--==========================
            CONTENIDO
    ===========================-->

    <main class="main">

        <!--==========================
                ENCABEZADO
        ===========================-->

        <header class="header">

            <div class="user-info">

                <div
                    class="avatar"
                    id="avatar">

                    AD

                </div>

                <div>

                    <h3 id="nombreUsuario">

                        Usuario

                    </h3>

                    <small id="rolUsuario">

                        Rol

                    </small>

                </div>

                <img
                    src="logoIAEV.png"
                    class="header-logo">

            </div>

            <a
                href="#"
                id="cerrarSesion"
                class="btn btn-danger">

                Salir

            </a>

        </header>

        <!--==========================
                TÍTULO
        ===========================-->

        <h1>

            📊 Reportes Académicos

        </h1>

        <p>

            Estadísticas generales obtenidas automáticamente desde Firebase.

        </p>

        <!--==========================
                TARJETAS
        ===========================-->

        <section class="cards-grid">

            <div class="card card-info">

                <h3>

                    📚 Total de Asesorías

                </h3>

                <h1 id="totalAsesorias">

                    0

                </h1>

            </div>

            <div class="card card-info">

                <h3>

                    👨‍🎓 Alumnos Atendidos

                </h3>

                <h1 id="totalAlumnos">

                    0

                </h1>

            </div>

            <div class="card card-info">

                <h3>

                    ⏰ Horas Impartidas

                </h3>

                <h1 id="totalHoras">

                    0 h

                </h1>

            </div>

            <div class="card card-info">

                <h3>

                    👨‍🏫 Total de Maestros

                </h3>

                <h1 id="totalMaestros">

                    0

                </h1>

            </div>

        </section>

        <script type="module">

/*=========================================
        IMPORTAR FIREBASE
=========================================*/

import { auth, db } from "./firebase.js";

import {

    signOut

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {

    collection,
    getDocs

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*=========================================
        REFERENCIAS FIRESTORE
=========================================*/

const asesoriasRef = collection(db, "asesorias");

const usuariosRef = collection(db, "usuarios");


/*=========================================
        DATOS DEL USUARIO
=========================================*/

const uid = localStorage.getItem("uid");

const nombre = localStorage.getItem("nombre");

const rol = localStorage.getItem("rol");


/*=========================================
        VALIDAR SESIÓN
=========================================*/

if (!uid) {

    window.location.href = "Login.html";

}


/*=========================================
        MOSTRAR USUARIO
=========================================*/

document.getElementById("nombreUsuario").textContent = nombre;

document.getElementById("rolUsuario").textContent = rol;


/*=========================================
        AVATAR
=========================================*/

const iniciales = nombre

    .split(" ")

    .map(p => p.charAt(0))

    .join("")

    .substring(0,2)

    .toUpperCase();

document.getElementById("avatar").textContent = iniciales;


/*=========================================
        OCULTAR MENÚ ADMIN
=========================================*/

if(rol !== "administrador"){

    document.getElementById("menuAdmin").style.display = "none";

}


/*=========================================
        VARIABLES
=========================================*/

let asesorias = [];

let usuarios = [];


/*=========================================
        ELEMENTOS HTML
=========================================*/

const totalAsesorias = document.getElementById("totalAsesorias");

const totalAlumnos = document.getElementById("totalAlumnos");

const totalHoras = document.getElementById("totalHoras");

const totalMaestros = document.getElementById("totalMaestros");


/*=========================================
        CERRAR SESIÓN
=========================================*/

document.getElementById("cerrarSesion").addEventListener("click", async(e)=>{

    e.preventDefault();

    await signOut(auth);

    localStorage.clear();

    window.location.href="Login.html";

});

/*=========================================
        CARGAR DATOS
=========================================*/

async function cargarDatos(){

    try{

        asesorias = [];

        usuarios = [];

        /*==============================
            LEER ASESORÍAS
        ==============================*/

        const snapshotAsesorias = await getDocs(asesoriasRef);

        snapshotAsesorias.forEach((doc)=>{

            asesorias.push({

                id: doc.id,

                ...doc.data()

            });

        });


        /*==============================
            LEER USUARIOS
        ==============================*/

        const snapshotUsuarios = await getDocs(usuariosRef);

        snapshotUsuarios.forEach((doc)=>{

            usuarios.push({

                id: doc.id,

                ...doc.data()

            });

        });


        actualizarDashboard();

    }

    catch(error){

        console.error("Error al cargar datos:", error);

        alert("No fue posible cargar las estadísticas.");

    }

}



/*=========================================
        ACTUALIZAR TARJETAS
=========================================*/

function actualizarDashboard(){

    /*==============================
            TOTAL ASESORÍAS
    ==============================*/

    totalAsesorias.textContent = asesorias.length;


    /*==============================
            ALUMNOS ÚNICOS
    ==============================*/

    const alumnos = new Set();

    asesorias.forEach((asesoria)=>{

        alumnos.add(asesoria.matricula);

    });

    totalAlumnos.textContent = alumnos.size;


    /*==============================
            HORAS IMPARTIDAS
    ==============================*/

    let minutosTotales = 0;

    asesorias.forEach((asesoria)=>{

        if(!asesoria.horaInicio || !asesoria.horaFin){

            return;

        }

        const inicio = new Date("2000-01-01T" + asesoria.horaInicio);

        const fin = new Date("2000-01-01T" + asesoria.horaFin);

        minutosTotales += (fin - inicio) / 60000;

    });

    const horas = Math.floor(minutosTotales / 60);

    const minutos = minutosTotales % 60;

    totalHoras.textContent = horas + " h " + minutos + " min";


    /*==============================
            TOTAL MAESTROS
    ==============================*/

    const maestros = usuarios.filter(usuario => usuario.rol === "maestro");

    totalMaestros.textContent = maestros.length;

}



/*=========================================
        INICIAR
=========================================*/

cargarDatos();

</script>

    </main>

</body>

</html>
