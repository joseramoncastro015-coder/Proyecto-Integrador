<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial | IAEV Asesorías</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">Inicio</a>
        <a href="Registrar.html">Registrar</a>
        <a href="Historial.html" class="active">Historial</a>
        <a href="Reportes.html">Reportes</a>
        <a href="Perfil.html">Perfil</a>

        <div id="menuAdmin">

            <a href="Usuarios.html">Usuarios</a>
            <a href="Maestros.html">Maestros</a>

        </div>

    </nav>

    <main class="main">

        <header class="header">

            <div class="user-info">

                <div class="avatar" id="avatar">MA</div>

                <div>

                    <h3 id="nombreUsuario">Usuario</h3>

                    <small id="rolUsuario">Maestro</small>

                </div>

                <img
                    src="logoIAEV.png"
                    alt="Logo IAEV"
                    class="header-logo">

            </div>

            <div class="header-buttons">

                <a
                    href="Login.html"
                    class="btn btn-danger"
                    id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <h1 class="mb-30">Historial de Asesorías</h1>

                <section class="card">

            <div class="search-box">

                <input
                    type="text"
                    id="buscador"
                    placeholder="Buscar por alumno, matrícula o materia...">

            </div>

            <div class="table-responsive">

                <table>

                    <thead>

                        <tr>

                            <th>Matrícula</th>
                            <th>Alumno</th>
                            <th>Materia</th>
                            <th>Cuatrimestre</th>
                            <th>Tipo</th>
                            <th>Fecha</th>
                            <th>Horario</th>
                            <th>Tema</th>
                            <th>Maestro</th>

                        </tr>

                    </thead>

                    <tbody id="tablaHistorial"></tbody>

                </table>

            </div>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./firebase.js";

        import {
            signOut
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const nombre = localStorage.getItem("nombre");
        const rol = localStorage.getItem("rol");
        const documentoUsuario = localStorage.getItem("documentoUsuario");

        if (!documentoUsuario) {

            window.location.href = "Login.html";

        }

        document.getElementById("nombreUsuario").textContent = nombre;
        document.getElementById("rolUsuario").textContent = rol;

        document.getElementById("avatar").textContent = nombre
            .split(" ")
            .map(p => p.charAt(0))
            .join("")
            .substring(0, 2)
            .toUpperCase();

        if (rol !== "administrador") {

            document.getElementById("menuAdmin").style.display = "none";

        }

        document.getElementById("cerrarSesion").addEventListener("click", async e => {

            e.preventDefault();

            await signOut(auth);

            localStorage.clear();

            window.location.href = "Login.html";

        });

                async function cargarHistorial() {

            const tabla = document.getElementById("tablaHistorial");

            tabla.innerHTML = "";

            const consulta = await getDocs(collection(db, "asesorias"));

            consulta.forEach(documento => {

                const datos = documento.data();

                if (
                    rol === "maestro" &&
                    datos.maestro !== nombre
                ) return;

                tabla.innerHTML += `
                    <tr>
                        <td>${datos.matricula}</td>
                        <td>${datos.nombre}</td>
                        <td>${datos.materia}</td>
                        <td>${datos.cuatrimestre}</td>
                        <td>${datos.tipo}</td>
                        <td>${datos.fecha}</td>
                        <td>${datos.horaInicio} - ${datos.horaFin}</td>
                        <td>${datos.tema}</td>
                        <td>${datos.maestro}</td>
                    </tr>
                `;

            });

        }

        document.getElementById("buscador").addEventListener("keyup", function () {

            const texto = this.value.toLowerCase();

            document.querySelectorAll("#tablaHistorial tr").forEach(fila => {

                fila.style.display = fila.textContent
                    .toLowerCase()
                    .includes(texto)
                    ? ""
                    : "none";

            });

        });

        cargarHistorial();

    </script>

</body>

</html>
