<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Perfil | IAEV Asesorías</title>

    <link rel="stylesheet"
          href="Estilo.css">

</head>

<body>

    <!--=========================================
                MENÚ LATERAL
    ==========================================-->

    <nav class="sidebar">

        <h2>

            IAEV
            <br>
            ASESORÍAS

        </h2>

        <hr>

        <a href="Inicio.html">

            Inicio

        </a>

        <a href="Registrar.html">

            Registrar

        </a>

        <a href="Historial.html">

            Historial

        </a>

        <a href="Reportes.html">

            Reportes

        </a>

        <a href="Perfil.html"
           class="active">

            Perfil

        </a>

        <div id="menuAdmin">

            <a href="Usuarios.html">

                Usuarios

            </a>

            <a href="Maestros.html">

                Maestros

            </a>

        </div>

    </nav>

    <!--=========================================
                CONTENIDO
    ==========================================-->

    <main class="main">

        <!--=========================================
                    ENCABEZADO
        ==========================================-->

        <header class="header">

            <div class="user-info">

                <div
                    class="avatar"
                    id="avatar">

                    AD

                </div>

                <div>

                    <h3 id="nombreUsuario">

                        Usuario

                    </h3>

                    <small id="rolUsuario">

                        Rol

                    </small>

                </div>

                <img
                    src="logoIAEV.png"
                    class="header-logo"
                    alt="Logo">

            </div>

            <a
                href="#"
                id="cerrarSesion"
                class="btn btn-danger">

                Salir

            </a>

        </header>

        <!--=========================================
                    TÍTULO
        ==========================================-->

        <h1>

            👤 Mi Perfil

        </h1>

        <p>

            Consulta y actualiza tu información personal.

        </p>

        <!--=========================================
                    TARJETA PERFIL
        ==========================================-->

        <section class="card">

            <div
                class="avatar avatar-grande"
                id="avatarPerfil">

                AD

            </div>

            <br>

            <div class="form-group">

                <label>

                    Nombre

                </label>

                <input
                    type="text"
                    id="perfilNombre"
                    readonly>

            </div>

            <div class="form-group">

                <label>

                    Usuario

                </label>

                <input
                    type="text"
                    id="perfilUsuario"
                    readonly>

            </div>

            <div class="form-group">

                <label>

                    Correo

                </label>

                <input
                    type="email"
                    id="perfilCorreo"
                    readonly>

            </div>

            <div class="form-group">

                <label>

                    Carrera

                </label>

                <input
                    type="text"
                    id="perfilCarrera"
                    readonly>

            </div>

            <div class="form-group">

                <label>

                    Rol

                </label>

                <input
                    type="text"
                    id="perfilRol"
                    readonly>

            </div>

        </section>

        <script type="module">

/*=========================================
        IMPORTAR FIREBASE
=========================================*/

import { auth, db } from "./firebase.js";

import {

    signOut

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {

    doc,
    getDoc,
    updateDoc

} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/*=========================================
        DATOS DEL USUARIO
=========================================*/

const documentoUsuario = localStorage.getItem("documentoUsuario");

const nombre = localStorage.getItem("nombre");

const rol = localStorage.getItem("rol");


/*=========================================
        VALIDAR SESIÓN
=========================================*/

if(!documentoUsuario){

    window.location.href = "Login.html";

}


/*=========================================
        MOSTRAR ENCABEZADO
=========================================*/

document.getElementById("nombreUsuario").textContent = nombre;

document.getElementById("rolUsuario").textContent = rol;


/*=========================================
        AVATAR
=========================================*/

const iniciales = nombre

.split(" ")

.map(p=>p.charAt(0))

.join("")

.substring(0,2)

.toUpperCase();

document.getElementById("avatar").textContent = iniciales;

document.getElementById("avatarPerfil").textContent = iniciales;


/*=========================================
        OCULTAR MENÚ ADMIN
=========================================*/

if(rol !== "administrador"){

    document.getElementById("menuAdmin").style.display = "none";

}


/*=========================================
        CARGAR PERFIL
=========================================*/

async function cargarPerfil(){

    try{

        const referencia = doc(

            db,

            "usuarios",

            documentoUsuario

        );

        const documento = await getDoc(referencia);

        if(!documento.exists()){

            alert("No se encontró el perfil.");

            return;

        }

        const datos = documento.data();

        document.getElementById("perfilNombre").value = datos.nombre || "";

        document.getElementById("perfilUsuario").value = datos.usuario || "";

        document.getElementById("perfilCorreo").value = datos.correo || "";

        document.getElementById("perfilCarrera").value = datos.carrera || "";

        document.getElementById("perfilRol").value = datos.rol || "";

    }

    catch(error){

        console.error(error);

        alert("Error al cargar el perfil.");

    }

}


/*=========================================
        CERRAR SESIÓN
=========================================*/

document.getElementById("cerrarSesion").addEventListener(

"click",

async(e)=>{

    e.preventDefault();

    await signOut(auth);

    localStorage.clear();

    window.location.href="Login.html";

});

/*=========================================
        INICIAR
=========================================*/

cargarPerfil();

</script>

    </main>

</body>

</html>
