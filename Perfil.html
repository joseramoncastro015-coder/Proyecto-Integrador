        <script type="module">
            import { auth, db } from "./firebase.js";

import { signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
        //====================================
        // OBTENER DATOS DEL LOGIN
        //====================================

        const rol = localStorage.getItem("rol");

        const nombre = localStorage.getItem("nombre");

        const correo = localStorage.getItem("correo");

        const menuAdmin = document.getElementById("menuAdmin");

        const nombreUsuario = document.getElementById("nombreUsuario");

        const rolUsuario = document.getElementById("rolUsuario");

        const avatar = document.getElementById("avatar");

        const avatarPerfil = document.getElementById("avatarPerfil");

        const nombrePerfil = document.getElementById("nombrePerfil");

        const usuarioPerfil = document.getElementById("usuarioPerfil");

        const correoPerfil = document.getElementById("correoPerfil");

        const carreraPerfil = document.getElementById("carreraPerfil");

        const rolPerfil = document.getElementById("rolPerfil");

        const panelAdministrador = document.getElementById("panelAdministrador");

        //====================================
        // VERIFICAR SESIÓN
        //====================================

        if(!rol){

            window.location.href="Login.html";

        }

        //====================================
        // DATOS GENERALES
        //====================================

        //====================================
// DATOS GENERALES
//====================================

nombreUsuario.textContent = nombre;

nombrePerfil.textContent = nombre;

//====================================
// MAESTRO Y ADMINISTRADOR
//====================================

if(rol==="maestro"){

    menuAdmin.style.display="none";

    panelAdministrador.style.display="none";

    rolUsuario.textContent="Maestro";

    rolPerfil.textContent="Maestro";

    avatar.textContent="MA";

    avatarPerfil.textContent="MA";

}

if(rol==="administrador"){

    menuAdmin.style.display="block";

    panelAdministrador.style.display="block";

    rolUsuario.textContent="Administrador";

    rolPerfil.textContent="Administrador";

    avatar.textContent="AD";

    avatarPerfil.textContent="AD";

}        

        //====================================
        // CERRAR SESIÓN
        //====================================

        document.getElementById("cerrarSesion").addEventListener("click", async function(e){

    e.preventDefault();

    await signOut(auth);

    localStorage.clear();

    window.location.href="Login.html";

});
        //====================================
// CARGAR DATOS DEL USUARIO
//====================================

async function cargarPerfil(){

    try{

        const consulta = query(

            collection(db,"usuarios"),

            where("correo","==",correo)

        );

        const resultado = await getDocs(consulta);

        resultado.forEach((doc)=>{

            const datos = doc.data();

            usuarioPerfil.textContent = datos.usuario || "No disponible";

            correoPerfil.textContent = datos.correo || "No disponible";

            carreraPerfil.textContent = datos.carrera || "No registrada";

        });

        if(rol==="administrador"){

            const usuarios = await getDocs(collection(db,"usuarios"));

            let totalUsuarios = 0;
            let totalMaestros = 0;

            usuarios.forEach((doc)=>{

                totalUsuarios++;

                if(doc.data().rol==="maestro"){

                    totalMaestros++;

                }

            });

            document.getElementById("usuariosSistema").textContent = totalUsuarios;

            document.getElementById("maestrosSistema").textContent = totalMaestros;

        }

    }

    catch(error){

        console.error(error);

        alert("No se pudo cargar el perfil.");

    }

}

cargarPerfil();

    </script>
