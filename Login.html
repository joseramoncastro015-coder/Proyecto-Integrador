<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | IAEV Asesorías</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <img
                src="logoIAEV.png"
                alt="Logo"
                class="login-logo">

            <h2>

                IAEV ASESORÍAS

            </h2>

            <p>

                Iniciar sesión

            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label>

                        Correo electrónico

                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Contraseña

                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="********"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Iniciar Sesión

                </button>

            </form>

            <p
                id="mensaje"
                style="margin-top:15px;color:red;text-align:center;">

            </p>

        </div>

    </div>

        <script type="module">

        import { auth, db } from "./firebase.js";

        import {

            signInWithEmailAndPassword

        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {

            collection,
            getDocs

        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const formulario = document.getElementById("loginForm");

        const mensaje = document.getElementById("mensaje");

        formulario.addEventListener("submit", async function(e){

            e.preventDefault();

            const correo = document.getElementById("correo").value.trim();

            const password = document.getElementById("password").value;

            mensaje.textContent = "";

            try{

                // Iniciar sesión en Firebase Authentication
                const credencial = await signInWithEmailAndPassword(

                    auth,
                    correo,
                    password

                );

                const uid = credencial.user.uid;

                // Buscar los datos del usuario en Firestore
                const consulta = await getDocs(collection(db,"usuarios"));

                let usuarioEncontrado = null;

                consulta.forEach((documento)=>{

                    const datos = documento.data();

                    if(datos.correo === correo){

                        usuarioEncontrado = datos;

                    }

                });

                if(!usuarioEncontrado){

                    mensaje.textContent = "No se encontró información del usuario.";

                    return;

                }

                // Guardar datos para usarlos en el resto del sistema
                localStorage.setItem("uid", uid);

                localStorage.setItem("nombre", usuarioEncontrado.nombre);

                localStorage.setItem("usuario", usuarioEncontrado.usuario);

                localStorage.setItem("correo", usuarioEncontrado.correo);

                localStorage.setItem("carrera", usuarioEncontrado.carrera);

                localStorage.setItem("rol", usuarioEncontrado.rol);

                // Ir al inicio
                window.location.href = "Inicio.html";

            }

            catch(error){

                console.error(error);

                mensaje.textContent = "Correo o contraseña incorrectos.";

            }

        });

    </script>

</body>

</html>
