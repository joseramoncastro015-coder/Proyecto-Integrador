<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Asesoría | IAEV</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">Inicio</a>
        <a href="Registrar.html" class="active">Registrar</a>
        <a href="Historial.html">Historial</a>
        <a href="Reportes.html">Reportes</a>
        <a href="Perfil.html">Perfil</a>

        <div id="menuAdmin">
            <a href="Maestros.html">Maestros</a>
        </div>

    </nav>

    <main class="main">

        <header class="header">

            <div class="user-info">

                <div class="avatar" id="avatar">MA</div>

                <div>

                    <h3 id="nombreUsuario">Usuario</h3>

                    <small id="rolUsuario">Maestro</small>

                </div>

                <img
                    src="logoIAEV.png"
                    alt="Logo IAEV"
                    class="header-logo">

            </div>

            <div class="header-buttons">

                <a
                    href="Login.html"
                    class="btn btn-danger"
                    id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <h1 class="mb-30">Registrar Asesoría</h1>

        <section class="card">

            <form id="formAsesoria">

                <div class="form-row">

                    <div class="form-group">

                        <label>Matrícula</label>

                        <input
                            type="text"
                            id="matricula"
                            placeholder="Ej. 25080529"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Nombre del alumno</label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Nombre completo"
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Materia</label>

                        <select id="materia" required>

                            <option value="">Selecciona un cuatrimestre primero</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Cuatrimestre</label>

                        <select id="cuatrimestre" required>

                            <option value="">Selecciona</option>
                            <option value="1">1°</option>
                            <option value="2">2°</option>
                            <option value="3">3°</option>
                            <option value="4">4°</option>
                            <option value="5">5°</option>
                            <option value="6">6°</option>
                            <option value="7">7°</option>
                            <option value="8">8°</option>
                            <option value="9">9°</option>

                        </select>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Tipo de asesoría</label>

                        <select id="tipo" required>

                            <option value="">Selecciona</option>
                            <option>Académica</option>
                            <option>Proyecto</option>
                            <option>Regularización</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Fecha</label>

                        <input
                            type="date"
                            id="fecha"
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Hora de inicio</label>

                        <input
                            type="time"
                            id="horaInicio"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Hora de fin</label>

                        <input
                            type="time"
                            id="horaFin"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>Tema tratado</label>

                    <textarea
                        id="tema"
                        rows="4"
                        placeholder="Describe el tema visto durante la asesoría..."
                        required></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Guardar Asesoría

                </button>

            </form>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./firebase.js";

import { signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    collection,
    addDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const nombre = localStorage.getItem("nombre");
const rol = localStorage.getItem("rol");
const documentoUsuario = localStorage.getItem("documentoUsuario");

if (!documentoUsuario) {

    window.location.href = "Login.html";

}

document.getElementById("nombreUsuario").textContent = nombre;

document.getElementById("rolUsuario").textContent = rol;

document.getElementById("avatar").textContent = nombre
    .split(" ")
    .map(p => p.charAt(0))
    .join("")
    .substring(0, 2)
    .toUpperCase();

if (rol !== "administrador") {

    document.getElementById("menuAdmin").style.display = "none";

}

document.getElementById("cerrarSesion").addEventListener("click", async e => {

    e.preventDefault();

    await signOut(auth);

    localStorage.clear();

    window.location.href = "Login.html";

});

const materiasPorCuatrimestre = {
    1: [
        "Inglés I",
        "Desarrollo Humano y Valores",
        "Fundamentos Matemáticos",
        "Dibujo y Técnicas de Representación",
        "Historia del Arte",
        "Narrativa y Guionismo",
        "Comunicación y Habilidades Digitales"
    ],

    2: [
        "Inglés II",
        "Habilidades Socioemocionales y Manejo de Conflictos",
        "Cálculo Diferencial",
        "Física",
        "Dibujo Digital y Teoría del Color",
        "Anatomía Humana y Animal",
        "Storyboard"
    ],

    3: [
        "Inglés III",
        "Desarrollo del Pensamiento y Toma de Decisiones",
        "Cálculo Integral",
        "Semiótica y Creación de Personajes",
        "Fundamentos de la Animación",
        "Taller de Escultura y Maquetas",
        "Proyecto Integrador I"
    ],

    4: [
        "Inglés IV",
        "Ética Profesional",
        "Cálculo de Varias Variables",
        "Probabilidad y Estadística",
        "Animación 2D",
        "Introducción al Modelado 3D",
        "Dirección Fotográfica"
    ],

    5: [
        "Inglés V",
        "Liderazgo de Equipos de Alto Desempeño",
        "Ecuaciones Diferenciales",
        "Grabación y Diseño de Audio",
        "Técnicas de Cine",
        "Escultura Digital de Personajes",
        "Proyecto Integrador II"
    ],

    6: [
        "Inglés VI",
        "Fundamentos y Producción de Efectos Visuales"
    ],

    7: [
        "Inglés VII",
        "Habilidades Gerenciales",
        "Rendering",
        "Introducción a la Animación 3D",
        "Rigging",
        "Texturizado e Iluminación 3D",
        "Cinematografía"
    ],

    8: [
        "Inglés VIII",
        "Dinámicos y Fluidos",
        "Postproducción Digital",
        "Animación de Personajes en 3D",
        "Rigging Facial",
        "Composición de Efectos",
        "Motion Graphics"
    ],

    9: [
        "Dinámicos de Tela y Cabello",
        "Animación 3D Avanzada",
        "Motores Gráficos",
        "Propiedad Intelectual",
        "Proyecto Integrador III"
    ]
};

const selectCuatrimestre = document.getElementById("cuatrimestre");
const selectMateria = document.getElementById("materia");

selectCuatrimestre.addEventListener("change", () => {

    const cuatrimestre = selectCuatrimestre.value;

    selectMateria.innerHTML =
        '<option value="">Selecciona una materia</option>';

    if (!materiasPorCuatrimestre[cuatrimestre]) return;

    materiasPorCuatrimestre[cuatrimestre].forEach(materia => {

        const opcion = document.createElement("option");

        opcion.value = materia;
        opcion.textContent = materia;

        selectMateria.appendChild(opcion);

    });

});

document.getElementById("formAsesoria").addEventListener("submit", async e => {

    e.preventDefault();

    const horaInicio = document.getElementById("horaInicio").value;
    const horaFin = document.getElementById("horaFin").value;

    if (horaFin <= horaInicio) {

        alert("La hora final debe ser mayor que la hora inicial.");
        return;

    }

    const inicio = new Date(`2000-01-01T${horaInicio}`);
    const fin = new Date(`2000-01-01T${horaFin}`);

    const diferencia = (fin - inicio) / 60000;

    const horas = Math.floor(diferencia / 60);
    const minutos = diferencia % 60;

    let tiempo = "";

    if (horas > 0) tiempo += horas + " h ";

    if (minutos > 0) tiempo += minutos + " min";

    try {

        await addDoc(collection(db, "asesorias"), {

            matricula: document.getElementById("matricula").value,
            nombre: document.getElementById("nombre").value,
            materia: document.getElementById("materia").value,
            cuatrimestre: document.getElementById("cuatrimestre").selectedOptions[0].text,
            tipo: document.getElementById("tipo").value,
            fecha: document.getElementById("fecha").value,
            horaInicio: horaInicio,
            horaFin: horaFin,
            tiempo: tiempo,
            tema: document.getElementById("tema").value,
            maestro: nombre,
            uid: documentoUsuario,
            fechaRegistro: new Date()

        });

        alert("✅ Asesoría registrada correctamente.");

        document.getElementById("formAsesoria").reset();

    } catch (error) {

        console.error(error);

        alert("Ocurrió un error al registrar la asesoría.");

    }

});

</script>

</body>

</html>
