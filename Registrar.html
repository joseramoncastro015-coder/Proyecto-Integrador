<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Asesoría | IAEV</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <!--=================================
            MENÚ LATERAL
    =================================-->

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">

            Inicio

        </a>

        <a href="Registrar.html" class="active">

            Registrar

        </a>

        <a href="Historial.html">

            Historial

        </a>

        <a href="Reportes.html">

            Reportes

        </a>

        <a href="Perfil.html">

            Perfil

        </a>

        <!-- SOLO ADMINISTRADOR -->

        <div id="menuAdmin">

            <a href="Usuarios.html">

                Usuarios

            </a>

            <a href="Maestros.html">

                Maestros

            </a>

        </div>

    </nav>

    <!--=================================
            CONTENIDO
    =================================-->

    <main class="main">

        <!--=================================
                HEADER
        =================================-->

        <header class="header">

            <div class="user-info">

                <div
                    class="avatar"
                    id="avatar">

                    MA

                </div>

                <div>

                    <h3 id="nombreUsuario">

                        Usuario

                    </h3>

                    <small id="rolUsuario">

                        Maestro

                    </small>

                </div>

                <img
                    src="logoIAEV.png"
                    alt="Logo IAEV"
                    class="header-logo">

            </div>

            <div class="header-buttons">

                <a
                    href="Login.html"
                    class="btn btn-danger"
                    id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <!--=================================
                TÍTULO
        =================================-->

        <h1 class="mb-30">

            Registrar Asesoría

        </h1>

        <!--=================================
                FORMULARIO
        =================================-->

        <section class="card">

            <form id="formAsesoria">

                <!-- Primera fila -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Matrícula</label>

                        <input
                            type="text"
                            id="matricula"
                            placeholder="Ej. 25080529"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Nombre del alumno</label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Nombre completo"
                            required>

                    </div>

                </div>

                <!-- Segunda fila -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Cuatrimestre</label>

                        <select
                            id="cuatrimestre"
                            required>

                            <option value="">Seleccionar</option>

                            <option>1°</option>
                            <option>2°</option>
                            <option>3°</option>
                            <option>4°</option>
                            <option>5°</option>
                            <option>6°</option>
                            <option>7°</option>
                            <option>8°</option>
                            <option>9°</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Materia</label>

                        <label for="materia">Materia</label>

<select id="materia" name="materia" required>

    <option value="">-- Selecciona una materia --</option>

    <!--=========================
        PRIMER CUATRIMESTRE
    =========================-->

    <optgroup label="Primer Cuatrimestre">

        <option>Inglés I</option>
        <option>Desarrollo Humano y Valores</option>
        <option>Fundamentos Matemáticos</option>
        <option>Dibujo y Técnicas de Representación</option>
        <option>Historia del Arte</option>
        <option>Narrativa y Guionismo</option>
        <option>Comunicación y Habilidades Digitales</option>

    </optgroup>

    <!--=========================
        SEGUNDO CUATRIMESTRE
    =========================-->

    <optgroup label="Segundo Cuatrimestre">

        <option>Inglés II</option>
        <option>Habilidades Socioemocionales y Manejo de Conflictos</option>
        <option>Cálculo Diferencial</option>
        <option>Física</option>
        <option>Dibujo Digital y Teoría del Color</option>
        <option>Anatomía Humana y Animal</option>
        <option>Storyboard</option>

    </optgroup>

    <!--=========================
        TERCER CUATRIMESTRE
    =========================-->

    <optgroup label="Tercer Cuatrimestre">

        <option>Inglés III</option>
        <option>Desarrollo del Pensamiento y Toma de Decisiones</option>
        <option>Cálculo Integral</option>
        <option>Semiótica y Creación de Personajes</option>
        <option>Fundamentos de la Animación</option>
        <option>Taller de Escultura y Maquetas</option>
        <option>Proyecto Integrador I</option>

    </optgroup>

    <!--=========================
        CUARTO CUATRIMESTRE
    =========================-->

    <optgroup label="Cuarto Cuatrimestre">

        <option>Inglés IV</option>
        <option>Ética Profesional</option>
        <option>Cálculo de Varias Variables</option>
        <option>Probabilidad y Estadística</option>
        <option>Animación 2D</option>
        <option>Introducción al Modelado 3D</option>
        <option>Dirección Fotográfica</option>

    </optgroup>

    <!--=========================
        QUINTO CUATRIMESTRE
    =========================-->

    <optgroup label="Quinto Cuatrimestre">

        <option>Inglés V</option>
        <option>Liderazgo de Equipos de Alto Desempeño</option>
        <option>Ecuaciones Diferenciales</option>
        <option>Grabación y Diseño de Audio</option>
        <option>Técnicas de Cine</option>
        <option>Escultura Digital de Personajes</option>
        <option>Proyecto Integrador II</option>

    </optgroup>

    <!--=========================
        SEXTO CUATRIMESTRE
    =========================-->

    <optgroup label="Sexto Cuatrimestre">

        <option>Estadía TSU en Producción Audiovisual y Animación 2D</option>

    </optgroup>

    <!--=========================
        SÉPTIMO CUATRIMESTRE
    =========================-->

    <optgroup label="Séptimo Cuatrimestre">

        <option>Inglés VII</option>
        <option>Habilidades Gerenciales</option>
        <option>Fundamentos y Producción de Efectos Visuales</option>
        <option>Introducción a la Animación 3D</option>
        <option>Rigging</option>
        <option>Texturizado e Iluminación 3D</option>
        <option>Cinematografía</option>

    </optgroup>

    <!--=========================
        OCTAVO CUATRIMESTRE
    =========================-->

    <optgroup label="Octavo Cuatrimestre">

        <option>Inglés VIII</option>
        <option>Dinámicos y Fluidos</option>
        <option>Rendering</option>
        <option>Animación de Personajes en 3D</option>
        <option>Rigging Facial</option>
        <option>Composición de Efectos</option>
        <option>Motion Graphics</option>

    </optgroup>

    <!--=========================
        NOVENO CUATRIMESTRE
    =========================-->

    <optgroup label="Noveno Cuatrimestre">

        <option>Dinámicos de Tela y Cabello</option>
        <option>Postproducción Digital</option>
        <option>Animación 3D Avanzada</option>
        <option>Motores Gráficos</option>
        <option>Propiedad Intelectual</option>
        <option>Proyecto Integrador III</option>

    </optgroup>

    <!--=========================
        DÉCIMO CUATRIMESTRE
    =========================-->

    <optgroup label="Décimo Cuatrimestre">

        <option>Estadía Ingeniería en Animación y Efectos Visuales</option>

    </optgroup>

</select>

                    </div>

                </div>

                <!-- Tercera fila -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Tipo de asesoría</label>

                        <select id="tipo">

                            <option>Académica</option>

                            <option>Proyecto</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Fecha</label>

                        <input
                            type="date"
                            id="fecha"
                            required>

                    </div>

                </div>

                <!-- Cuarta fila -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Hora de inicio</label>

                        <input
                            type="time"
                            id="horaInicio"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Hora de fin</label>

                        <input
                            type="time"
                            id="horaFin"
                            required>

                    </div>

                </div>

                <!-- Tema -->

                <div class="form-group">

                    <label>Tema tratado</label>

                    <textarea
                        id="tema"
                        placeholder="Describe el tema tratado durante la asesoría..."
                        required></textarea>

                </div>

                <!-- Botón -->

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Guardar Asesoría

                </button>

            </form>

        </section>

    </main>

        <script>

        //====================================
        // OBTENER DATOS DEL LOGIN
        //====================================

        const rol = localStorage.getItem("rol");

        const nombre = localStorage.getItem("nombre");

        const menuAdmin = document.getElementById("menuAdmin");

        const nombreUsuario = document.getElementById("nombreUsuario");

        const rolUsuario = document.getElementById("rolUsuario");

        const avatar = document.getElementById("avatar");

        //====================================
        // VERIFICAR SESIÓN
        //====================================

        if(!rol){

            window.location.href="Login.html";

        }

        //====================================
        // CONFIGURAR MAESTRO
        //====================================

        if(rol==="maestro"){

            menuAdmin.style.display="none";

            nombreUsuario.innerHTML=nombre;

            rolUsuario.innerHTML="Maestro";

            avatar.innerHTML="MA";

        }

        //====================================
        // CONFIGURAR ADMINISTRADOR
        //====================================

        if(rol==="administrador"){

            menuAdmin.style.display="block";

            nombreUsuario.innerHTML=nombre;

            rolUsuario.innerHTML="Administrador";

            avatar.innerHTML="AD";

        }

        //====================================
        // CERRAR SESIÓN
        //====================================

        document.getElementById("cerrarSesion").addEventListener("click",function(){

            localStorage.clear();

        });

        //====================================
        // REGISTRAR ASESORÍA
        //====================================

        document.getElementById("formAsesoria").addEventListener("submit",function(e){

            e.preventDefault();

            const asesoria={

                matricula:document.getElementById("matricula").value,

                nombre:document.getElementById("nombre").value,

                cuatrimestre:document.getElementById("cuatrimestre").value,

                materia:document.getElementById("materia").value,

                tipo:document.getElementById("tipo").value,

                fecha:document.getElementById("fecha").value,

                horaInicio:document.getElementById("horaInicio").value,

                horaFin:document.getElementById("horaFin").value,

                tema:document.getElementById("tema").value,

                maestro:nombre

            };

            console.log("Asesoría registrada:");

            console.table(asesoria);

            alert("La asesoría se registró correctamente.");

            document.getElementById("formAsesoria").reset();

        });

    </script>

</body>

</html>
