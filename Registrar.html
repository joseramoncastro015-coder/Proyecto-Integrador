<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Asesoría | IAEV</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">Inicio</a>
        <a href="Registrar.html" class="active">Registrar</a>
        <a href="Historial.html">Historial</a>
        <a href="Reportes.html">Reportes</a>
        <a href="Perfil.html">Perfil</a>

        <div id="menuAdmin">

            <a href="Usuarios.html">Usuarios</a>
            <a href="Maestros.html">Maestros</a>

        </div>

    </nav>

    <main class="main">

        <header class="header">

            <div class="user-info">

                <div class="avatar" id="avatar">MA</div>

                <div>

                    <h3 id="nombreUsuario">Usuario</h3>

                    <small id="rolUsuario">Maestro</small>

                </div>

                <img src="logoIAEV.png"
                     alt="Logo IAEV"
                     class="header-logo">

            </div>

            <div class="header-buttons">

                <a href="Login.html"
                   class="btn btn-danger"
                   id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <h1 class="mb-30">Registrar Asesoría</h1>

        <section class="card">

            <form id="formAsesoria">

                                <div class="form-row">

                    <div class="form-group">

                        <label>Matrícula</label>

                        <input
                            type="text"
                            id="matricula"
                            placeholder="Ej. 25080529"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Nombre del alumno</label>

                        <input
                            type="text"
                            id="nombre"
                            placeholder="Nombre completo"
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Materia</label>

                        <input
                            type="text"
                            id="materia"
                            placeholder="Ej. Programación"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Cuatrimestre</label>

                        <select id="cuatrimestre" required>

                            <option value="">Selecciona</option>
                            <option>1°</option>
                            <option>2°</option>
                            <option>3°</option>
                            <option>4°</option>
                            <option>5°</option>
                            <option>6°</option>
                            <option>7°</option>
                            <option>8°</option>
                            <option>9°</option>

                        </select>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Tipo de asesoría</label>

                        <select id="tipo" required>

                            <option value="">Selecciona</option>
                            <option>Académica</option>
                            <option>Proyecto</option>
                            <option>Regularización</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Fecha</label>

                        <input
                            type="date"
                            id="fecha"
                            required>

                    </div>

                </div>

                                <div class="form-row">

                    <div class="form-group">

                        <label>Hora de inicio</label>

                        <input
                            type="time"
                            id="horaInicio"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Hora de fin</label>

                        <input
                            type="time"
                            id="horaFin"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>Tema tratado</label>

                    <textarea
                        id="tema"
                        rows="4"
                        placeholder="Describe el tema visto durante la asesoría..."
                        required></textarea>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Guardar Asesoría

                </button>

            </form>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./firebase.js";

        import {
            signOut
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {
            collection,
            addDoc
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const nombre = localStorage.getItem("nombre");
        const rol = localStorage.getItem("rol");
        const documentoUsuario = localStorage.getItem("documentoUsuario");

        if (!documentoUsuario) {

            window.location.href = "Login.html";

        }

        document.getElementById("nombreUsuario").textContent = nombre;
        document.getElementById("rolUsuario").textContent = rol;

        document.getElementById("avatar").textContent = nombre
            .split(" ")
            .map(p => p.charAt(0))
            .join("")
            .substring(0, 2)
            .toUpperCase();

        if (rol !== "administrador") {

            document.getElementById("menuAdmin").style.display = "none";

        }

        document.getElementById("cerrarSesion").addEventListener("click", async e => {

            e.preventDefault();

            await signOut(auth);

            localStorage.clear();

            window.location.href = "Login.html";

        });

                document.getElementById("formAsesoria").addEventListener("submit", async e => {

            e.preventDefault();

            try {

                await addDoc(collection(db, "asesorias"), {

                    matricula: document.getElementById("matricula").value,
                    nombre: document.getElementById("nombre").value,
                    materia: document.getElementById("materia").value,
                    cuatrimestre: document.getElementById("cuatrimestre").value,
                    tipo: document.getElementById("tipo").value,
                    fecha: document.getElementById("fecha").value,
                    horaInicio: document.getElementById("horaInicio").value,
                    horaFin: document.getElementById("horaFin").value,
                    tema: document.getElementById("tema").value,
                    maestro: nombre

                });

                alert("Asesoría registrada correctamente.");

                document.getElementById("formAsesoria").reset();

            } catch (error) {

                console.error(error);

                alert("Ocurrió un error al registrar la asesoría.");

            }

        });

    </script>

</body>

</html>
