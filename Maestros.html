<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maestros | IAEV Asesorías</title>

    <link rel="stylesheet" href="Estilo.css">

</head>

<body>

    <nav class="sidebar">

        <h2>IAEV ASESORÍAS</h2>

        <hr>

        <a href="Inicio.html">Inicio</a>

        <a href="Registrar.html">Registrar</a>

        <a href="Historial.html">Historial</a>

        <a href="Reportes.html">Reportes</a>

        <a href="Perfil.html">Perfil</a>

        <div id="menuAdmin">

            <a href="Usuarios.html">Usuarios</a>

            <a href="Maestros.html" class="active">Maestros</a>

        </div>

    </nav>

    <main class="main">

        <header class="header">

            <div class="user-info">

                <div class="avatar" id="avatar">

                    AD

                </div>

                <div>

                    <h3 id="nombreUsuario">

                        Administrador

                    </h3>

                    <small id="rolUsuario">

                        Administrador

                    </small>

                </div>

                <img
                    src="logoIAEV.png"
                    alt="Logo"
                    class="header-logo">

            </div>

            <div class="header-buttons">

                <a
                    href="Login.html"
                    class="btn btn-danger"
                    id="cerrarSesion">

                    Salir

                </a>

            </div>

        </header>

        <h1 class="mb-30">

            Administración de Maestros

        </h1>

        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Usuario</th>

                        <th>Nombre</th>

                        <th>Correo</th>

                        <th>Carrera</th>

                        <th>Acciones</th>

                    </tr>

                </thead>

                <tbody id="tablaMaestros">

                </tbody>

            </table>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./firebase.js";

        import { signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

        import {

            collection,
            getDocs,
            deleteDoc,
            updateDoc,
            doc

        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

                const rolLogin = localStorage.getItem("rol");
        const nombreLogin = localStorage.getItem("nombre");

        if(!rolLogin){

            window.location.href="Login.html";

        }

        if(rolLogin!=="administrador"){

            alert("No tienes permisos para acceder a esta página.");

            window.location.href="Inicio.html";

        }

        document.getElementById("nombreUsuario").textContent=nombreLogin;
        document.getElementById("rolUsuario").textContent="Administrador";
        document.getElementById("avatar").textContent="AD";

        document.getElementById("cerrarSesion").addEventListener("click",async e=>{

            e.preventDefault();

            await signOut(auth);

            localStorage.clear();

            window.location.href="Login.html";

        });

        async function cargarMaestros(){

            const tabla=document.getElementById("tablaMaestros");

            tabla.innerHTML="";

            try{

                const consulta=await getDocs(collection(db,"usuarios"));

                consulta.forEach(documento=>{

                    const datos=documento.data();

                    if(datos.rol!=="maestro") return;

                    tabla.innerHTML+=`

                    <tr>

                        <td>${datos.usuario}</td>

                        <td>${datos.nombre}</td>

                        <td>${datos.correo}</td>

                        <td>${datos.carrera}</td>

                        <td>

                            <button
                                class="btn btn-primary"
                                onclick="editarMaestro('${documento.id}')">

                                Editar

                            </button>

                            <button
                                class="btn btn-danger"
                                onclick="eliminarMaestro('${documento.id}')">

                                Eliminar

                            </button>

                        </td>

                    </tr>

                    `;

                });

            }catch(error){

                console.error(error);

                alert("No se pudieron cargar los maestros.");

            }

        }

        cargarMaestros();

                window.editarMaestro = async function(id){

            try{

                const nuevoNombre=prompt("Nuevo nombre:");

                if(nuevoNombre===null) return;

                const nuevoUsuario=prompt("Nuevo usuario:");

                if(nuevoUsuario===null) return;

                const nuevoCorreo=prompt("Nuevo correo:");

                if(nuevoCorreo===null) return;

                const nuevaCarrera=prompt("Nueva carrera:");

                if(nuevaCarrera===null) return;

                await updateDoc(doc(db,"usuarios",id),{

                    nombre:nuevoNombre,
                    usuario:nuevoUsuario,
                    correo:nuevoCorreo,
                    carrera:nuevaCarrera,
                    rol:"maestro"

                });

                alert("Maestro actualizado correctamente.");

                cargarMaestros();

            }catch(error){

                console.error(error);

                alert("No se pudo actualizar el maestro.");

            }

        };

        window.eliminarMaestro = async function(id){

            const confirmar=confirm("¿Deseas eliminar este maestro?");

            if(!confirmar) return;

            try{

                await deleteDoc(doc(db,"usuarios",id));

                alert("Maestro eliminado correctamente.");

                cargarMaestros();

            }catch(error){

                console.error(error);

                alert("No se pudo eliminar el maestro.");

            }

        };

    </script>

</body>

</html>
